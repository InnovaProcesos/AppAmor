<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Isla de Valen y el Lobito 3D</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            /* Fondo de cielo estilo Mario */
            background: linear-gradient(180deg, #4facfe 0%, #00f2fe 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mario-font { font-family: 'Fredoka One', cursive; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; }
        .soft-shadow { filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3)); }

        .screen {
            display: none;
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            position: relative;
            z-index: 10;
        }
        .screen.active {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        /* ==========================================
           ANIMACIÓN CINEMÁTICA PERSONAJES (INICIO)
           ========================================== */
        .cinematic-stage {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 250px;
            position: relative;
            margin-bottom: 2rem;
            perspective: 800px;
        }
        
        .character {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 120px;
            z-index: 10;
        }

        /* Cabezas usando tus imágenes */
        .head-img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            z-index: 3;
            position: relative;
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.4));
            transition: transform 0.3s;
        }

        /* Cuerpos base */
        .body-base {
            width: 70px;
            height: 80px;
            border-radius: 40px 40px 30px 30px;
            position: relative;
            margin-top: -30px;
            z-index: 1;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2);
        }
        /* Colores basados en tus imágenes */
        .wolf-body { background: linear-gradient(to bottom, #7EB5A6, #F5B880); } 
        .bear-body { background: linear-gradient(to bottom, #DDA782, #FDF5E6); } 

        /* Extremidades animadas */
        .arm {
            position: absolute;
            width: 22px;
            height: 45px;
            border-radius: 20px;
            top: 15px;
            transform-origin: top center;
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.2);
        }
        .wolf-arm { background: #7EB5A6; }
        .bear-arm { background: #DDA782; }
        
        .arm-left { left: -10px; }
        .arm-right { right: -10px; }
        
        .leg {
            position: absolute;
            width: 25px;
            height: 30px;
            border-radius: 10px 10px 20px 20px;
            bottom: -15px;
            background: inherit;
        }
        .leg-left { left: 5px; }
        .leg-right { right: 5px; }

        /* COREOGRAFÍA DEL BESO Y ABRAZO */
        .wolf-anim { animation: wolfAction 6s infinite ease-in-out; }
        .bear-anim { animation: bearAction 6s infinite ease-in-out; }
        
        .wolf-anim .arm-right { animation: hugRight 6s infinite ease-in-out; }
        .bear-anim .arm-left { animation: hugLeft 6s infinite ease-in-out; }
        
        .wolf-anim .arm-left { animation: waveArm 6s infinite ease-in-out; }
        .bear-anim .arm-right { animation: waveArm 6s infinite ease-in-out; animation-delay: 0.5s; }

        @keyframes wolfAction {
            0%, 100% { transform: translateX(-40px) translateY(0); } /* Separados */
            15%, 35% { transform: translateX(25px) translateY(-10px) rotate(10deg); } /* Se acercan y besan */
            60%, 80% { transform: translateX(-40px) translateY(0) rotate(0); } /* Vuelven a posición para saludar */
        }
        @keyframes bearAction {
            0%, 100% { transform: translateX(40px) translateY(0); }
            15%, 35% { transform: translateX(-25px) translateY(-10px) rotate(-10deg); } 
            60%, 80% { transform: translateX(40px) translateY(0) rotate(0); } 
        }

        @keyframes hugRight {
            0%, 100%, 60%, 80% { transform: rotate(-20deg); }
            15%, 35% { transform: rotate(-80deg) translateX(-10px) translateY(10px); } /* Abraza */
        }
        @keyframes hugLeft {
            0%, 100%, 60%, 80% { transform: rotate(20deg); }
            15%, 35% { transform: rotate(80deg) translateX(10px) translateY(10px); }
        }

        @keyframes waveArm {
            0%, 40% { transform: rotate(0deg); }
            60%, 80% { transform: rotate(130deg) translateY(-10px); } /* Levanta el brazo para saludar */
            65%, 75% { transform: rotate(110deg) translateY(-10px); } /* Agita */
        }

        /* Corazones explosivos del beso */
        .kiss-fx {
            position: absolute;
            bottom: 120px;
            font-size: 3rem;
            opacity: 0;
            z-index: 20;
            animation: burstHeart 6s infinite;
        }
        @keyframes burstHeart {
            0%, 14% { opacity: 0; transform: scale(0) translateY(0); }
            20% { opacity: 1; transform: scale(1.5) translateY(-30px); }
            35% { opacity: 0; transform: scale(2) translateY(-80px); }
            100% { opacity: 0; }
        }


        /* ==========================================
           MAPA 3D ESTILO MARIO PARTY 
           ========================================== */
        .island-perspective {
            perspective: 1200px;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            height: 60vh;
            min-height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .world-base {
            position: relative;
            width: 500px;
            height: 500px;
            /* Inclinación de mesa 3D */
            transform: rotateX(60deg) rotateZ(-15deg);
            transform-style: preserve-3d;
            border-radius: 50%;
            background: radial-gradient(circle, #4facfe 0%, #0072ff 100%);
            /* Borde dorado de la mesa y profundidad del agua */
            box-shadow: 
                0 10px 0 #0056b3,
                0 15px 0 #d4af37, /* Borde dorado */
                0 25px 30px rgba(0,0,0,0.6),
                inset 0 0 40px rgba(255,255,255,0.4);
            transition: transform 0.5s;
            animation: floatTable 4s ease-in-out infinite alternate;
        }
        @keyframes floatTable {
            from { transform: rotateX(60deg) rotateZ(-15deg) translateY(0px); }
            to { transform: rotateX(58deg) rotateZ(-12deg) translateY(-15px); }
        }

        /* Diferentes Biomas (Islas) */
        .biome {
            position: absolute;
            transform-style: preserve-3d;
        }
        /* Pradera (Abajo Izquierda) */
        .biome-grass {
            width: 220px; height: 180px;
            background: #5dc237;
            border-radius: 50% 40% 60% 40%;
            bottom: 40px; left: 30px;
            box-shadow: 0 15px 0 #3a821e, inset 0 10px 10px rgba(255,255,255,0.3);
        }
        /* Desierto (Arriba Izquierda) */
        .biome-desert {
            width: 180px; height: 150px;
            background: #f7d059;
            border-radius: 40% 60% 40% 50%;
            top: 40px; left: 40px;
            box-shadow: 0 15px 0 #c7a02c, inset 0 10px 10px rgba(255,255,255,0.3);
        }
        /* Lava (Arriba Derecha) */
        .biome-lava {
            width: 200px; height: 160px;
            background: #222;
            border-radius: 60% 40% 50% 50%;
            top: 50px; right: 30px;
            box-shadow: 0 15px 0 #000, inset 0 0 20px #ff4500;
            border: 2px solid #ff4500;
        }
        /* Playa/Tropical (Abajo Derecha) */
        .biome-tropical {
            width: 160px; height: 160px;
            background: #20b2aa;
            border-radius: 50%;
            bottom: 60px; right: 40px;
            box-shadow: 0 15px 0 #008080, inset 0 10px 10px rgba(255,255,255,0.3);
        }

        /* Nubes flotando en el mapa */
        .map-cloud {
            position: absolute;
            background: #fff;
            border-radius: 50px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transform: translateZ(50px); /* Flotan por encima */
        }

        /* Nodos 3D (Cilindros) */
        .level-node {
            position: absolute;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            /* Se contrarresta la inclinación de la mesa para que miren arriba */
            transform: translate(-50%, -50%) translateZ(20px) rotateX(-60deg) rotateZ(15deg); 
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            z-index: 20;
            transition: all 0.3s;
            background: #fff;
            color: #333;
            box-shadow: 0 5px 0 #ccc, 0 10px 10px rgba(0,0,0,0.5);
        }

        .level-node.completed {
            background: #4ade80;
            color: white;
            box-shadow: 0 5px 0 #16a34a, 0 10px 10px rgba(0,0,0,0.5);
        }

        .level-node.unlocked {
            background: #ff007f;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #be185d, 0 10px 15px rgba(255,0,127,0.6);
            animation: pulseNode 1s infinite alternate;
        }
        @keyframes pulseNode {
            to { transform: translate(-50%, -50%) translateZ(35px) rotateX(-60deg) rotateZ(15deg) scale(1.2); }
        }

        /* Avatar Osita en el Mapa (Usa la imagen) */
        #map-avatar {
            position: absolute;
            width: 60px;
            /* Contrarresta la rotación para estar de pie */
            transform: translate(-50%, -100%) translateZ(40px) rotateX(-60deg) rotateZ(15deg);
            z-index: 30;
            transition: top 1.5s ease-in-out, left 1.5s ease-in-out;
            filter: drop-shadow(0 20px 10px rgba(0,0,0,0.6));
            animation: bounceAvatar 0.5s infinite alternate;
        }
        @keyframes bounceAvatar {
            to { transform: translate(-50%, -100%) translateZ(55px) rotateX(-60deg) rotateZ(15deg); }
        }

        /* UI Paneles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            color: #333;
        }

        .btn-mario {
            background: #ff004f;
            color: white;
            border: 4px solid #fff;
            border-radius: 40px;
            padding: 15px 40px;
            font-size: 1.8rem;
            box-shadow: 0 8px 0 #b30037, 0 15px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.1s;
        }
        .btn-mario:active {
            transform: translateY(8px);
            box-shadow: 0 0px 0 #b30037, 0 5px 5px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="container mx-auto px-4 relative z-10 w-full max-w-4xl min-h-screen flex flex-col justify-center py-10">

        <!-- PANTALLA 1: INICIO CINEMÁTICO -->
        <section id="screen-home" class="screen active flex-col items-center justify-center text-center">
            
            <div class="cinematic-stage">
                <!-- LOBITO -->
                <div class="character wolf-anim">
                    <!-- ¡AQUÍ CARGA TU IMAGEN DEL LOBITO! -->
                    <img src="image_42b75e.png" alt="Lobito" class="head-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3233/3233483.png'">
                    <div class="body-base wolf-body">
                        <div class="arm wolf-arm arm-left"></div>
                        <div class="arm wolf-arm arm-right"></div>
                        <div class="leg leg-left"></div>
                        <div class="leg leg-right"></div>
                    </div>
                </div>

                <div class="kiss-fx">💖✨</div>

                <!-- OSITA -->
                <div class="character bear-anim">
                    <!-- ¡AQUÍ CARGA TU IMAGEN DE LA OSITA! -->
                    <img src="image_42b79c.png" alt="Osita" class="head-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3069/3069172.png'">
                    <div class="body-base bear-body">
                        <div class="arm bear-arm arm-left"></div>
                        <div class="arm bear-arm arm-right"></div>
                        <div class="leg leg-left"></div>
                        <div class="leg leg-right"></div>
                    </div>
                </div>
            </div>

            <div class="bg-white/20 backdrop-blur-md p-8 rounded-[40px] border-4 border-white shadow-2xl mt-8">
                <h2 class="text-3xl text-yellow-300 mb-2 mario-font">Super Valen Bros</h2>
                <h1 class="text-5xl md:text-6xl mario-font mb-6 text-white tracking-wide">
                    La Isla del Amor
                </h1>
                <p class="text-white text-xl font-bold mb-8 drop-shadow-md">
                    ¡La osita y el lobito te invitan a jugar! Supera los 10 mundos para ganar el gran premio.
                </p>
                
                <button onclick="enterMapWorld()" class="btn-mario mario-font">
                    ¡START! <i class="fa-solid fa-play ml-2"></i>
                </button>
            </div>
        </section>


        <!-- PANTALLA 2: EL MAPA 3D -->
        <section id="screen-map" class="screen flex-col items-center justify-center">
            
            <div class="w-full flex justify-between items-center mb-4 px-8">
                <h2 class="text-4xl mario-font text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]">Selecciona el Mundo</h2>
                <div class="bg-white/80 text-black px-6 py-2 rounded-full font-bold text-xl flex items-center gap-2">
                    <i class="fa-solid fa-star text-yellow-500"></i> <span id="star-count">0</span>/10
                </div>
            </div>
            
            <div class="island-perspective">
                <div class="world-base" id="map-container">
                    
                    <!-- BIOMAS (Islas) -->
                    <div class="biome biome-grass"></div>
                    <div class="biome biome-desert"></div>
                    <div class="biome biome-lava"></div>
                    <div class="biome biome-tropical"></div>

                    <!-- Detalles decorativos (Nubes) -->
                    <div class="map-cloud" style="width: 80px; height: 30px; top: 20%; left: 10%;"></div>
                    <div class="map-cloud" style="width: 100px; height: 40px; top: 60%; right: 10%;"></div>
                    <div class="map-cloud" style="width: 60px; height: 25px; bottom: 30%; left: 40%;"></div>

                    <!-- Avatar Osita (La misma imagen para recorrer el mapa) -->
                    <img src="image_42b79c.png" id="map-avatar" alt="Avatar" onerror="this.style.display='none'">

                    <!-- Nodos inyectados por JS -->
                    <div id="nodes-container"></div>
                </div>
            </div>
        </section>


        <!-- PANTALLA 3: LA PREGUNTA -->
        <section id="screen-game-question" class="screen flex-col w-full glass-panel p-8 relative overflow-hidden">
            <button onclick="navTo('screen-map')" class="absolute top-6 left-6 text-gray-600 font-bold hover:text-black z-10"><i class="fa-solid fa-circle-left text-2xl mr-2"></i> Salir</button>
            
            <div class="text-center mt-8 mb-6">
                <span id="level-indicator" class="text-white text-3xl px-8 py-3 rounded-full mario-font bg-blue-500 shadow-[0_5px_0_#0056b3]">Mundo 1</span>
            </div>
            
            <div class="flex justify-center gap-2 text-red-500 text-3xl mb-6" id="lives-container"></div>

            <div class="min-h-[120px] flex items-center justify-center mb-8 bg-white/50 rounded-3xl p-6 shadow-inner">
                <h2 id="question-text" class="text-3xl font-black text-center text-gray-800"></h2>
            </div>

            <div id="answer-container" class="w-full mb-4 flex flex-col justify-center"></div>

            <button id="btn-submit" onclick="checkTextAnswer()" class="hidden w-full mx-auto mt-8 btn-mario" style="max-width: 300px;">
                Responder
            </button>
        </section>

        <!-- OVERLAY: NIVEL SUPERADO -->
        <div id="level-passed-overlay" class="absolute inset-0 bg-white/90 z-50 hidden flex-col items-center justify-center backdrop-blur-sm" onclick="closeLevelPassedOverlay()">
            <div class="text-center transform scale-0 transition-transform duration-500" id="passed-content">
                <img src="image_42b75e.png" class="w-40 h-40 object-contain mx-auto mb-4 drop-shadow-xl animate-bounce" onerror="this.style.display='none'">
                <h2 class="text-6xl mario-font text-yellow-500 mb-4 drop-shadow-[0_4px_0_#b45309]">¡Genial!</h2>
                <p class="text-3xl text-gray-800 font-bold" id="passed-msg"></p>
                <p class="mt-8 text-lg font-bold text-blue-500 animate-pulse">Toca para seguir avanzando</p>
            </div>
        </div>

    </div>

    <script>
        // PREGUNTAS
        const gameLevels = [
            { type: 'choice', question: '¿Prueba 1: Listos para jugar?', options: ['No', '¡Sí!'], answer: '¡Sí!', msg: '¡Empezamos la aventura!' },
            { type: 'text', question: 'Escribe una palabra tierna', answer: 'amor', msg: '¡Qué linda eres!' },
            { type: 'choice', question: 'Mundo 3', options: ['A', 'B'], answer: 'A', msg: '¡Vas volando!' },
            { type: 'choice', question: 'Mundo 4', options: ['A', 'B'], answer: 'A', msg: '¡Increíble!' },
            { type: 'choice', question: 'Mundo 5', options: ['A', 'B'], answer: 'A', msg: '¡Ya casi a la mitad!' },
            { type: 'choice', question: 'Mundo 6', options: ['A', 'B'], answer: 'A', msg: '¡Súper Valen!' },
            { type: 'choice', question: 'Mundo 7', options: ['A', 'B'], answer: 'A', msg: '¡Eres invencible!' },
            { type: 'choice', question: 'Mundo 8', options: ['A', 'B'], answer: 'A', msg: '¡Entrando a la lava!' },
            { type: 'choice', question: 'Mundo 9', options: ['A', 'B'], answer: 'A', msg: '¡Un paso más!' },
            { type: 'choice', question: 'Castillo Final', options: ['Ganar', 'Perder'], answer: 'Ganar', msg: '¡Rescataste el tesoro!' }
        ];

        // Coordenadas agrupadas por las islas (Biomas)
        const mapCoordinates = [
            { x: 25, y: 80 }, { x: 45, y: 70 }, // Pradera
            { x: 15, y: 40 }, { x: 35, y: 35 }, // Desierto
            { x: 50, y: 50 }, // Centro agua
            { x: 80, y: 75 }, { x: 70, y: 60 }, // Tropical
            { x: 85, y: 35 }, { x: 65, y: 25 }, // Lava
            { x: 50, y: 15 } // Jefe Final
        ];

        let currentLevelIndex = 0; 
        let unlockedLevel = 0;     
        let attemptsLeft = 3;

        function navTo(screenId) {
            document.querySelectorAll('.screen').forEach(s => {
                s.classList.remove('active');
                setTimeout(() => { if(!s.classList.contains('active')) s.style.display = 'none'; }, 600);
            });
            setTimeout(() => {
                const target = document.getElementById(screenId);
                target.style.display = 'flex';
                void target.offsetWidth; 
                target.classList.add('active');
            }, 600);
        }

        function enterMapWorld() {
            navTo('screen-map');
            buildMap();
            setTimeout(() => updateOsitaPosition(0), 800); 
        }

        function buildMap() {
            const container = document.getElementById('nodes-container');
            container.innerHTML = '';
            document.getElementById('star-count').innerText = unlockedLevel;
            
            mapCoordinates.forEach((coord, i) => {
                const node = document.createElement('div');
                node.className = 'level-node';
                node.style.left = `${coord.x}%`;
                node.style.top = `${coord.y}%`;
                node.innerText = i + 1;

                if (i < unlockedLevel) {
                    node.classList.add('completed');
                    node.innerHTML = '<i class="fa-solid fa-star"></i>';
                } else if (i === unlockedLevel) {
                    node.classList.add('unlocked');
                    node.onclick = () => openLevel(i);
                }

                container.appendChild(node);
            });
        }

        function updateOsitaPosition(index) {
            const avatar = document.getElementById('map-avatar');
            const target = mapCoordinates[index];
            avatar.style.left = `${target.x}%`;
            avatar.style.top = `${target.y}%`;
        }

        function openLevel(index) {
            currentLevelIndex = index;
            attemptsLeft = 3;
            loadQuestionUI();
            navTo('screen-game-question');
        }

        function loadQuestionUI() {
            const q = gameLevels[currentLevelIndex];
            document.getElementById('question-text').textContent = q.question;
            document.getElementById('level-indicator').textContent = `Mundo ${currentLevelIndex + 1}`;
            
            renderLivesUI();
            const ansCont = document.getElementById('answer-container'); 
            ansCont.innerHTML = ''; 
            const btnSub = document.getElementById('btn-submit');

            if (q.type === 'text') {
                btnSub.style.display = 'block';
                const input = document.createElement('input'); input.type = 'text'; input.id = 'answer-input';
                input.className = 'w-full max-w-lg mx-auto border-4 border-blue-400 rounded-2xl px-6 py-4 text-center text-3xl font-bold text-gray-700 outline-none focus:border-yellow-400 bg-white shadow-inner';
                input.placeholder = "Escribe aquí...";
                ansCont.appendChild(input); 
            } else {
                btnSub.style.display = 'none'; 
                const grid = document.createElement('div'); grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl mx-auto';
                q.options.forEach(opt => {
                    const btn = document.createElement('button'); btn.textContent = opt;
                    btn.className = 'bg-white text-blue-600 border-4 border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-2xl font-black py-6 px-4 rounded-3xl transition-all shadow-[0_8px_0_#bfdbfe] active:translate-y-2 active:shadow-none';
                    btn.onclick = () => checkChoiceAnswer(opt); grid.appendChild(btn);
                });
                ansCont.appendChild(grid);
            }
        }

        function renderLivesUI() {
            const cont = document.getElementById('lives-container'); cont.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const icon = document.createElement('i');
                icon.className = i < attemptsLeft ? 'fa-solid fa-heart animate-bounce' : 'fa-regular fa-heart text-gray-400';
                cont.appendChild(icon);
            }
        }

        function checkChoiceAnswer(sel) {
            if (sel.toLowerCase().trim() === gameLevels[currentLevelIndex].answer.toLowerCase().trim()) handleRight(); 
            else handleWrong();
        }

        function checkTextAnswer() {
            const val = document.getElementById('answer-input').value.trim().toLowerCase();
            if (!val) return;
            if (val.includes(gameLevels[currentLevelIndex].answer.toLowerCase())) handleRight(); 
            else handleWrong();
        }

        function handleRight() {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 }, shapes: ['star'], colors: ['#FFE400', '#FFBD00', '#E89400', '#FFCA6C', '#FDFFB8'] });
            
            document.getElementById('passed-msg').textContent = gameLevels[currentLevelIndex].msg;
            const overlay = document.getElementById('level-passed-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => document.getElementById('passed-content').style.transform = 'scale(1)', 50);
        }

        function closeLevelPassedOverlay() {
            document.getElementById('passed-content').style.transform = 'scale(0)';
            setTimeout(() => {
                document.getElementById('level-passed-overlay').style.display = 'none';
                navTo('screen-map');
                
                if (unlockedLevel === currentLevelIndex) unlockedLevel++;
                
                setTimeout(() => {
                    buildMap();
                    updateOsitaPosition(unlockedLevel < 10 ? unlockedLevel : 9);
                    if (unlockedLevel === 10) setTimeout(() => alert("¡Victoria Total!"), 2000);
                }, 700); 
            }, 500);
        }

        function handleWrong() {
            attemptsLeft--; renderLivesUI();
            if (attemptsLeft <= 0) {
                alert("¡El lobito te atrapó! Se reinicia el nivel.");
                attemptsLeft = 3; renderLivesUI();
            }
        }
    </script>
</body>
</html>
